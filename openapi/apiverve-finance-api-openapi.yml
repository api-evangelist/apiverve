  /v1/earnings:
    get:
      summary: Earnings Report
      description: Get earnings and financial data for a company by ticker symbol. Optionally filter by year and quarter.
      operationId: earnings
      parameters:
      - name: ticker
        in: query
        schema:
          type: string
        required: true
        description: Stock ticker symbol (e.g. AAPL, MSFT, ADBE)
        example: ADBE
      - name: year
        in: query
        schema:
          type: integer
        required: false
        description: Fiscal year to retrieve. Defaults to latest available.
      - name: quarter
        in: query
        schema:
          type: integer
        required: false
        description: Fiscal quarter to retrieve. Defaults to latest available.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
