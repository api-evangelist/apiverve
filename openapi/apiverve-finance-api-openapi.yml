          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Finance
  /v1/cpiinflation:
    get:
      summary: CPI Inflation
      description: Get current or historical CPI inflation data by category
      operationId: cpiinflation
      parameters:
      - name: date
        in: query
        schema:
          type: string
        required: false
        description: Optional date in YYYY-MM format for historical lookup. Omit for current data.
        example: 2023-06
      - name: category
        in: query
        schema:
          type: string
        required: false
        description: 'Optional category filter: all, food, housing, apparel, transportation, medical, recreation, education, gasoline, electricity'
        example: food
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  yearMonth: 2026-08
                  year: 2026
                  month: 8
                  category: food
                  index: 350.418
                  yearOverYearChange: 2.67
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
