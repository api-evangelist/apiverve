      tags:
      - Finance
  /v1/currencyconverter:
    get:
      summary: Currency Converter
      description: Convert currency rates based on the amount and currency
      operationId: currencyconverter
      parameters:
      - name: value
        in: query
        schema:
          type: number
        required: true
        description: The amount to convert
        example: 1
      - name: from
        in: query
        schema:
          type: string
        required: true
        description: The ISO 4217 currency code to convert from
        example: USD
      - name: to
        in: query
        schema:
          type: string
        required: true
        description: The ISO 4217 currency code to convert to
        example: EUR
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  from: USD
                  to: EUR
                  value: 1
                  convertedValue: 0.866496
                  rate: 0.866496
                  change24h: 0.000493
                  change24hPct: 0.0569
                  changeDirection: up
                  high24h: 0.866914
                  low24h: 0.865725
                  lastUpdated: '2026-09-15T21:00:17.674Z'
