  /v1/dividends:
    get:
      summary: Dividends
      description: Get the dividend-per-share history for a company by ticker symbol. Optionally choose the annual or quarterly series and limit how many periods are returned.
      operationId: dividends
      parameters:
      - name: ticker
        in: query
        schema:
          type: string
        required: true
        description: Stock ticker symbol (e.g. AAPL, MSFT, KO)
        example: AAPL
      - name: period
        in: query
        schema:
          type: string
        required: false
        description: 'Which series to return in the history list: quarterly (default) or annual.'
        example: annual
      - name: limit
        in: query
        schema:
          type: integer
        required: false
        description: Number of periods to return in the history list (1-25). Defaults to 5.
        example: 10
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ticker: AAPL
                  cik: 0000320193
                  company: Apple Inc.
                  currency: USD
                  paysDividend: true
                  latestDividendPerShare: 0.26
                  latestDividendPeriod: CY2026Q1
                  latestDividendDate: '2026-03-28'
                  count: 5
                  dividends:
