        in: query
        schema:
          type: string
        required: true
        description: 'ISO country code (2 or 3 letter). Examples: US, USA, DE, DEU, GB, GBR'
        example: USA
      - name: year
        in: query
        schema:
          type: integer
        required: false
        description: Specific year to retrieve data for (1991-present). Returns latest if not specified.
        example: 2023
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
