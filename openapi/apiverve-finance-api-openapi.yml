  /v1/vatrates:
    get:
      summary: VAT Rates
      description: Returns VAT rates for a country. Optionally specify a date for historical rates or a postcode for regional exceptions.
      operationId: vatrates
      parameters:
      - name: country
        in: query
        schema:
          type: string
        required: true
        description: ISO 2-letter country code (e.g., DE, FR, ES)
        example: DE
      - name: date
        in: query
        schema:
          type: string
        required: false
        description: Look up rate effective on this date (YYYY-MM-DD). Defaults to today.
        example: '2020-07-01'
      - name: postcode
        in: query
        schema:
          type: string
        required: false
        description: Check for regional exceptions (e.g., Canary Islands, Ceuta)
        example: '35001'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  country: DE
                  countryName: Germany
                  currency: EUR
                  effectiveFrom: '2021-01-01'
                  rates:
                    standard: 19
                    reduced: 7
                    reduced2: null
                    superReduced: null
                    parking: null
                  exception: null
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
