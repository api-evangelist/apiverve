          type: string
        required: false
        description: 'Optional filter for a single point. Legacy security types: bills, notes, bonds, tips, frn. Or a maturity: 1mo, 3mo, 6mo, 1yr, 2yr, 3yr, 5yr, 7yr, 10yr, 20yr, 30yr'
        example: 10yr
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  date: '2024-02-01'
                  bills: 5.24
                  notes: 4.35
                  bonds: 4.67
                  tips: 2.15
                  frn: 5.31
                  changes:
                    bills:
                      change1d: 0.02
                      direction: up
                    notes:
                      change1d: -0.03
                      direction: down
                    bonds:
                      change1d: 0.01
                      direction: up
                    tips:
                      change1d: 0
                      direction: unchanged
                    frn:
                      change1d: 0.02
                      direction: up
                  previousDate: '2024-01-31'
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
