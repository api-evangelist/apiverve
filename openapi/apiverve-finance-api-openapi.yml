  /v1/costliving:
    get:
      summary: Cost of Living
      description: Get the cost of living index for a specific location. Accepts state names, state codes, or major city names.
      operationId: costliving
      parameters:
      - name: location
        in: query
        schema:
          type: string
        required: true
        description: State name, state code (e.g., CA, NY), or major city name.
        example: California
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  searchedLocation: California
                  region: west-large
                  regionName: West Large Metros (LA, SF, Seattle, Phoenix, Denver area)
                  costIndex: 107
                  description: 7% above average
                  cpi: 356.993
                  usAverageCPI: 334.98
                  period: 2026-08
