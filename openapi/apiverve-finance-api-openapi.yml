openapi: 3.2.0
info:
  title: APIVerve Finance API
  description: One API key, 370+ real-world REST endpoints — weather, geocoding, finance, DNS, validation, text processing and more. Every endpoint returns JSON. Full documentation at https://docs.apiverve.com.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  license:
    name: APIVerve Terms of Service
    url: https://apiverve.com/terms/
  version: 1.0.0
  x-logo:
    url: https://apiverve.com/images/favicon.png
    altText: APIVerve
servers:
- url: https://api.apiverve.com
security:
- api_key: []
tags:
- name: Finance
paths:
  /v1/balancesheet:
    get:
      summary: Balance Sheet
      description: Get the balance sheet for a company by ticker symbol. Optionally filter to a specific fiscal year and quarter.
      operationId: balancesheet
      parameters:
      - name: ticker
        in: query
        schema:
          type: string
        required: true
        description: Stock ticker symbol (e.g. AAPL, MSFT, ADBE)
        example: AAPL
      - name: year
        in: query
        schema:
          type: integer
        required: false
        description: Fiscal year to retrieve. Defaults to latest available. History covers only the quarters captured so far; a missing period answers 404 listing the available ones.
      - name: quarter
        in: query
        schema:
          type: integer
        required: false
        description: Fiscal quarter to retrieve. Defaults to latest available.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ticker: AAPL
                  company: Apple Inc.
                  cik: 0000320193
                  fiscalYear: 2025
                  fiscalQuarter: 4
                  filingType: 10-K
                  filingDate: '2025-10-31'
                  periodEnd: '2025-09-27'
                  balance:
                    totalAssets: 359241000000
                    currentAssets: 147957000000
                    cash: 35934000000
                    receivables: 39777000000
                    inventory: 5718000000
                    propertyAndEquipment: 49834000000
                    goodwill: null
                    intangibles: null
                    totalLiabilities: 285508000000
                    currentLiabilities: 165631000000
                    accountsPayable: 69860000000
                    longTermDebt: 78328000000
                    equity: 73733000000
                    retainedEarnings: -14264000000
                  ratios:
                    currentRatio: 0.89
                    quickRatio: 0.86
                    cashRatio: 0.22
                    workingCapital: -17674000000
                    debtToEquity: 3.87
                    debtToAssets: 0.79
                    longTermDebtToEquity: 1.06
                    equityMultiplier: 4.87
                  formatted:
                    totalAssets: $359.24B
                    totalLiabilities: $285.51B
                    equity: $73.73B
                    workingCapital: -$17.67B
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Finance
  /v1/benchmarkrate:
    get:
      summary: Benchmark Rate
      description: Get the current value for a specific benchmark rate.
      operationId: benchmarkrate
      parameters:
      - name: rate
        in: query
        schema:
          type: string
        required: true
        description: The benchmark rate to retrieve
        example: SOFR
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  rate: SOFR
                  name: Secured Overnight Financing Rate
                  currency: USD
                  region: United States
                  administrator: Federal Reserve Bank of New York
                  value: 4.32
                  date: '2026-02-04'
                  lastUpdated: '2026-02-05T05:00:00.000Z'
                  change1d: -0.01
                  changeDirection: down
                  previousValue: 4.33
                  previousDate: '2026-02-03'
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Finance
  /v1/binlookup:
    get:
      summary: BIN Lookup
      description: Lookup credit card information based on the BIN
      operationId: binlookup
      parameters:
      - name: bin
        in: query
        schema:
          type: string
        required: true
        description: The first six digits of the credit card number (BIN)
        example: '448590'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  bin: '448590'
                  brand: VISA
                  type: CREDIT
                  category: PURCHASING
                  country: United States
                  issuer:
                    name: JPMORGAN CHASE BANK, N.A.
                    country: United States
                    phone: 1-800-432-3117
                    website: www.chase.com
                  location:
                    latitude: '37.0902'
                    longitude: '-95.7129'
                    alpha2: US
                    alpha3: USA
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Finance
  /v1/bitcoin:
    get:
      summary: Bitcoin Price
      description: Get the current price of Bitcoin. You can optionally specify a currency, e.g. USD
      operationId: bitcoin
      parameters:
      - name: currency
        in: query
        schema:
          type: string
        required: false
        description: The currency to get the price in
        example: USD
      - name: hourly
        in: query
        schema:
          type: boolean
        required: false
        description: Include hourly price data for the past 24 hours
        example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  currency: USD
                  price: 97250.43
                  marketCap: 1928000000000
                  volume24h: 35420000000
                  change24h: -1.52
                  lastUpdated: '2026-02-07T12:00:00.000Z'
                  high24h: 98750.21
                  low24h: 96125.88
                  changeDirection: down
                  formatted:
                    price: $97,250.43
                    marketCap: $1.93T
                    volume: $35.42B
                    priceWords: ninety-seven thousand two hundred fifty dollars
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Finance
  /v1/cashflow:
