  /v1/countryflags:
    get:
      summary: Country Flags
      description: Country Flag is a simple tool for getting the country's national flags. It returns the country's national flags.
      operationId: countryflags
      parameters:
      - name: country
        in: query
        schema:
          type: string
        required: true
        description: The 2 letter ISO Country Code (e.g. ZW)
        example: ZW
      - name: format
        in: query
        schema:
          type: string
        required: true
        description: The format of the flag image
        example: png
      - name: shape
        in: query
        schema:
          type: string
        required: true
        description: The shape of the flag image
        example: circle
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  country: Zimbabwe
                  countryCode: ZW
                  shape: circle
                  format: png
                  downloadUrl: https://storage.googleapis.com/apiverve/APIResources/countryflags/circle/png/zw.png?GoogleAccessId=635500398038-compute%40developer.gserviceaccount.com&Expires=1766096512&Signature=EfbtYmSr82YpFvV%2FYWRrlA66wKW4j2%2F2n6EDLGnpwhxd9pXvzBQm4xhNVnwRy3tHCvDTWNQTQUaP9kndqcqm5NBlsfzgJlHpBLPLNt3xRBgXwAm5vmPMfoQY%2B%2BHwmYkxBH1H%2BnIkoWeXEsDLoh1MdwUfvTKKP9PDlCyc2FQUJyZoqXxdshHE9l%2Fv019N9z3AipL7jpmeJQnMTDtos8aCa2I9dm%2FzgpMvi2fdMiRfMCNsjlbyug0h0w6wO1W3FLc3K477psnT4BcXARBmn3dYq4hSSLdmhPnKMpCrYXFnhdxZq0VHXNHid1FwLYuMcp%2FPHIJ1%2Fj2OvqMUPEpip%2Fq%2FpA%3D%3D
