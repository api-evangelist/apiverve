openapi: 3.2.0
info:
  title: APIVerve Geography API
  description: One API key, 370+ real-world REST endpoints — weather, geocoding, finance, DNS, validation, text processing and more. Every endpoint returns JSON. Full documentation at https://docs.apiverve.com.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  license:
    name: APIVerve Terms of Service
    url: https://apiverve.com/terms/
  version: 1.0.0
  x-logo:
    url: https://apiverve.com/images/favicon.png
    altText: APIVerve
servers:
- url: https://api.apiverve.com
security:
- api_key: []
tags:
- name: Geography
paths:
  /v1/citieslookup:
    get:
      summary: Cities Lookup
      description: Lookup city data based on the city name
      operationId: citieslookup
      parameters:
      - name: city
        in: query
        schema:
          type: string
        required: true
        description: The city name for which you want to get the data (e.g., New York)
        example: San Francisco
      - name: limit
        in: query
        schema:
          type: integer
        required: false
        description: Limit number of cities that match your search criteria
        example: 5
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  search: San Francisco
                  foundCities:
                  - name: San Francisco
                    altName: ''
                    country: US
                    countryName: United States
                    featureCode: PPLA2
                    population: 874961
                    populationCategory: major
                    loc:
                      type: Point
                      coordinates:
                      - -122.4194
                      - 37.7749
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Geography
  /v1/coordinatesaresea:
    get:
      summary: Coordinates Are Sea
      description: Check if the coordinates are in the sea
      operationId: coordinatesaresea
      parameters:
      - name: lat
        in: query
        schema:
          type: number
        required: true
        description: The latitude of the coordinates
        example: 37.7749
      - name: lon
        in: query
        schema:
          type: number
        required: true
        description: The longitude of the coordinates
        example: -122.4194
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  latitude: 37.7749
                  longitude: -122.4194
                  isSea: false
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Geography
  /v1/countryborders:
    get:
      summary: Country Borders
      description: Country Borders is a simple tool for getting the list of neighboring countries for a specific country. It returns the list of neighboring countries for the specified country.
      operationId: countryborders
      parameters:
      - name: country
        in: query
        schema:
          type: string
        required: true
        description: The Country 2 Letter ISO code (e.g., CA)
        example: CA
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  country: Canada
                  cca2: CA
                  landlocked: false
                  region: Americas
                  subregion: Northern America
                  coordinates:
                    lat: 60
                    lng: -95
                  borders:
                  - USA
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Geography
  /v1/countryboundaries:
    get:
      summary: Country Boundaries
      description: Country Boundaries is a simple tool for getting the shape of a specific country's border. It returns the shape of the specified country's border.
      operationId: countryboundaries
      parameters:
      - name: country
        in: query
        schema:
          type: string
        required: true
        description: The Country 2 Letter ISO code (e.g., CA)
        example: CA
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  features:
