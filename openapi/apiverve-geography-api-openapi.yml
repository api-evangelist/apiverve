  /v1/countrylanguages:
    get:
      summary: Country Languages
      description: Country Languages is a simple tool for getting the list of official and commonly spoken languages in a specific country.
      operationId: countrylanguages
      parameters:
      - name: country
        in: query
        schema:
          type: string
        required: true
        description: The Country 2 letter ISO code for which you want to get languages for data (e.g., ZW)
        example: ZW
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
