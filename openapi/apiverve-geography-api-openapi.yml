  /v1/zipcodes:
    get:
      summary: Zip Codes Lookup
      description: Lookup the zip code information
      operationId: zipcodes
      parameters:
      - name: zip
        in: query
        schema:
          type: string
        required: true
        description: The zip code for which you want to get the data
        example: '64082'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  zipcode: '64082'
                  state_abbr: MO
                  latitude: '38.850243'
                  longitude: '-94.39570'
                  city: Lees Summit
                  state: Missouri
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Geography
