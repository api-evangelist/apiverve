        required: false
        description: 'Grid size: small, medium, large'
        example: medium
      - name: theme
        in: query
        schema:
          type: string
        required: false
        description: 'Theme: random, animals, food, sports, science, geography'
        example: animals
      - name: difficulty
        in: query
        schema:
          type: string
        required: false
        description: 'Difficulty: easy, medium, hard'
        example: medium
      - name: image
        in: query
        schema:
          type: boolean
        required: false
        description: Set to true to generate a downloadable puzzle image
        example: true
      - name: solutionImage
        in: query
        schema:
          type: boolean
        required: false
        description: Set to true to generate a downloadable solution image
        example: true
      responses:
        '200':
          description: Successful Response
