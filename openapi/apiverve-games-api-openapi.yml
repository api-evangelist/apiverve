      description: Create a maze puzzle
      operationId: maze
      parameters:
      - name: width
        in: query
        schema:
          type: integer
        required: false
        description: Maze width
        example: 15
      - name: height
        in: query
        schema:
          type: integer
        required: false
        description: Maze height
        example: 15
      - name: difficulty
        in: query
        schema:
          type: string
        required: false
        description: Difficulty level
        example: medium
      - name: image
        in: query
        schema:
          type: boolean
        required: false
        description: Set to true to generate a downloadable maze image
        example: true
      - name: solutionImage
        in: query
        schema:
          type: boolean
        required: false
        description: Set to true to generate a downloadable solution image
