  /v1/coinflipper:
    get:
      summary: Coin Flipper
      description: Flip one or more coins and get detailed results
      operationId: coinflipper
      parameters:
      - name: flips
        in: query
        schema:
          type: integer
        required: false
        description: Number of coins to flip
        example: 10
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  total_flips: 10
                  flips:
                  - Tails
                  - Heads
                  - Heads
                  - Tails
                  - Tails
                  - Heads
                  - Tails
                  - Tails
                  - Tails
                  - Tails
                  heads_count: 3
                  tails_count: 7
                  heads_percentage: 30
                  tails_percentage: 70
                  longest_streak:
                    length: 4
                    type: Tails
                  first_flip: Tails
                  last_flip: Tails
                  is_fair: false
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
