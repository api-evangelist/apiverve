  /v1/rockpaperscissors:
    get:
      summary: Rock Paper Scissors
      description: Play rounds of Rock Paper Scissors with outcome analysis
      operationId: rockpaperscissors
      parameters:
      - name: choice
        in: query
        schema:
          type: string
        required: false
        description: Your choice - omit for random
        example: rock
      - name: rounds
        in: query
        schema:
          type: integer
        required: false
        description: Number of rounds to play
        example: 5
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  total_rounds: 5
                  player_choice_mode: manual
                  games:
                  - round: 1
                    player_choice: rock
                    player_emoji: 🪨
                    computer_choice: paper
                    computer_emoji: 📄
                    outcome: computer
                    message: Computer wins! undefined
                  - round: 2
                    player_choice: rock
                    player_emoji: 🪨
                    computer_choice: rock
                    computer_emoji: 🪨
                    outcome: tie
                    message: It's a tie! Both chose rock
                  - round: 3
                    player_choice: rock
                    player_emoji: 🪨
                    computer_choice: rock
                    computer_emoji: 🪨
                    outcome: tie
                    message: It's a tie! Both chose rock
                  - round: 4
                    player_choice: rock
                    player_emoji: 🪨
                    computer_choice: paper
                    computer_emoji: 📄
                    outcome: computer
                    message: Computer wins! undefined
                  - round: 5
                    player_choice: rock
                    player_emoji: 🪨
                    computer_choice: scissors
                    computer_emoji: ✂️
                    outcome: player
                    message: You win! Rock crushes scissors
                  results:
                    player_wins: 1
                    computer_wins: 2
                    ties: 2
                    player_win_percentage: 20
                    computer_win_percentage: 40
                    tie_percentage: 40
                  overall_winner: computer
                  game_rules:
                    rock_beats: scissors
                    paper_beats: rock
                    scissors_beats: paper
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Games
