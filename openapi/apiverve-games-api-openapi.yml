    get:
      summary: Cryptogram Generator
      description: Create a cryptogram puzzle
      operationId: cryptogram
      parameters:
      - name: text
        in: query
        schema:
          type: string
        required: false
        description: Text to encode (max 500 characters)
        example: The quick brown fox
      - name: random
        in: query
        schema:
          type: boolean
        required: false
        description: Use a random famous quote instead of text (a quote is also used when text is omitted)
        example: true
      - name: image
        in: query
        schema:
          type: boolean
        required: false
        description: Set to true to generate a downloadable puzzle image
        example: true
      - name: solutionImage
        in: query
        schema:
          type: boolean
        required: false
        description: Set to true to generate a downloadable solution image
        example: true
      responses:
        '200':
          description: Successful Response
          content:
