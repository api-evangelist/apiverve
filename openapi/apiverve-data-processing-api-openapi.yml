  /v1/morsecode:
    post:
      summary: Morse Code
      description: Morse Code is a simple tool for encoding and decoding Morse code. It returns the encoded or decoded Morse code.
      operationId: morsecode
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  text: This Is A Message
                  morse: '- .... .. ... / .. ... / .- / -- . ... ... .- --. . '
                  stats:
                    characters: 17
                    dits: 25
                    dahs: 7
