  /v1/murmurhash:
    post:
      summary: MurmurHash
      description: Generate a MurmurHash3 hash
      operationId: murmurhash
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  hash: 1586663183
                  hashHex: 5e928f0f
                  variant: murmur3_32
                  seed: 0
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: The text to hash
                seed:
                  type: integer
                  description: Seed value for the hash function
                variant:
                  type: string
                  description: 'Hash variant: 32 (32-bit) or 128 (128-bit)'
              required:
              - text
      tags:
      - Data Processing
  /v1/sqlexplainer:
    post:
      summary: SQL Explainer
      description: Get a plain English explanation of a SQL query
      operationId: sqlexplainer
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  explanation: This SQL query retrieves the names of users and the number of orders they have placed. It filters users who were created after January 1, 2024. The query then groups the results by user ID and only includes users who have placed more than 5 orders, finally ordering the results by the order count in descending order.
                  operation: SELECT
                  tables:
                  - users
                  - orders
                  complexity: moderate
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: The SQL query to explain
                detail:
                  type: string
                  description: 'Explanation detail level: brief, standard, or detailed'
              required:
              - query
      tags:
      - Data Processing
