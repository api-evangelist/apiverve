info:
  title: APIVerve Data Processing API
  description: One API key, 370+ real-world REST endpoints — weather, geocoding, finance, DNS, validation, text processing and more. Every endpoint returns JSON. Full documentation at https://docs.apiverve.com.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  license:
    name: APIVerve Terms of Service
    url: https://apiverve.com/terms/
  version: 1.0.0
  x-logo:
    url: https://apiverve.com/images/favicon.png
    altText: APIVerve
servers:
- url: https://api.apiverve.com
security:
- api_key: []
tags:
- name: Data Processing
paths:
  /v1/counter:
    get:
      summary: Cloud Counter
      description: Get the current value of the counter
      operationId: counter
      parameters:
      - name: id
        in: query
        schema:
          type: string
        required: true
        description: The ID of the counter (e.g., test_counter)
        example: test_counter
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  created: '2024-04-26T22:09:46.000Z'
                  id: test_counter
                  lastAction: get
                  lastRead: '2025-12-16T22:21:45.000Z'
                  lastUpdated: '2024-04-26T22:09:46.000Z'
                  numberOfDigits: 1
                  ordinal: zeroth
                  value: 0
                  words: zero
                  isEven: true
                  isNegative: false
                  isZero: true
                  isPrime: false
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Data Processing
  /v1/htmltotext:
    post:
      summary: HTML to Text
      description: Convert HTML to text
      operationId: htmltotext
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  text: This is an example paragraph. Anything in the body tag will appear on the page, just like this p tag and its contents.
                  parsed: true
                  extractionMethod: article
                  detectedLanguage:
                    language: english
                    confidence: 0.3507446808510638
                  characterCount: 118
                  wordCount: 23
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                html:
                  type: string
                  description: The HTML to convert to text
              required:
              - html
      tags:
      - Data Processing
