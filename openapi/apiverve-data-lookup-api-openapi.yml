        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Data Lookup
  /v1/timezonelookup:
    get:
      summary: Timezone Lookup
      description: Lookup timezone data based on the city name
      operationId: timezonelookup
      parameters:
      - name: city
        in: query
        schema:
          type: string
        required: true
        description: The city name for which you want to get the data (e.g., Harare)
        example: Harare
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  timezone: Africa/Harare
                  timezone_offset: 120
                  date: '2025-12-17'
                  time: 00:30
                  time24: 00:30:23
                  time12: 12:30:23 AM
                  day: Wednesday
                  month: December
                  year: '2025'
                  unix: '1765924223'
                  dst: false
                  dst_start: '2025-12-17 00:30:23'
                  dst_end: '2025-12-17 00:30:23'
                  dst_name: CAT
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Data Lookup
  /v1/unicodelookup:
    get:
      summary: Unicode Character Lookup
      description: Get detailed information about a Unicode character
      operationId: unicodelookup
      parameters:
      - name: character
        in: query
        schema:
          type: string
        required: false
        description: The Unicode character to lookup. Supply either character or codepoint.
        example: 👋
      - name: codepoint
        in: query
        schema:
          type: string
        required: false
        description: The Unicode codepoint in hex (e.g., '1F44B' or 'U+1F44B'). Supply either character or codepoint.
        example: 1F44B
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
