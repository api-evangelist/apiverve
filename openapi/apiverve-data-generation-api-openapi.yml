  /v1/colorpalette:
    get:
      summary: Color Palette Generator
      description: Generate a color palette from a single color
      operationId: colorpalette
      parameters:
      - name: color
        in: query
        schema:
          type: string
        required: true
        description: 'The base color to generate the palette from (HEX format without #)'
        example: FF5733
      - name: scheme
        in: query
        schema:
          type: string
        required: false
        description: The color scheme type
        example: triade
      - name: variation
        in: query
        schema:
          type: string
        required: false
        description: The color variation
        example: soft
      - name: count
        in: query
        schema:
          type: integer
        required: false
        description: Caps how many colors are returned (1-16). Each scheme has its own ceiling and count cannot raise it - mono yields 4, contrast 8, triade and analogic 12, tetrade 16. The colorCount field reports how many were actually returned. Free tier limited to 5 colors
        example: 5
      - name: distance
        in: query
        schema:
          type: number
        required: false
        description: Color spacing distance (0-1). Affects triade, tetrade, and analogic schemes
        example: 0.5
      - name: addComplement
        in: query
        schema:
          type: boolean
        required: false
        description: Add complement color to analogic scheme
        example: true
      - name: webSafe
        in: query
        schema:
          type: boolean
        required: false
        description: Return web-safe colors only
        example: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  source: '#FF5733'
                  sourceName: Outrageous Orange
                  hue: 11
                  scheme: triade
                  variation: soft
                  distance: 0.5
                  colorCount: 5
                  colorPalette:
                  - hex: '#CC988F'
                    name: Oriental Pink
                    rgb:
                      r: 204
                      g: 152
                      b: 143
                    hsl:
                      h: 9
                      s: 37
                      l: 68
                    luminance: 0.373
                    isDark: true
                    textColor: '#FFFFFF'
                    accessibility:
                      contrastWithWhite: 2.48
                      contrastWithBlack: 8.46
                      wcagAANormal: false
                      wcagAALarge: false
                      wcagAAA: false
                  - hex: '#805F59'
                    name: Russett
                    rgb:
                      r: 128
                      g: 95
                      b: 89
                    hsl:
                      h: 9
                      s: 18
                      l: 43
                    luminance: 0.135
                    isDark: true
                    textColor: '#FFFFFF'
                    accessibility:
