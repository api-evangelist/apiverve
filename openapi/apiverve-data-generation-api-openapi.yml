openapi: 3.2.0
info:
  title: APIVerve Data Generation API
  description: One API key, 370+ real-world REST endpoints — weather, geocoding, finance, DNS, validation, text processing and more. Every endpoint returns JSON. Full documentation at https://docs.apiverve.com.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  license:
    name: APIVerve Terms of Service
    url: https://apiverve.com/terms/
  version: 1.0.0
  x-logo:
    url: https://apiverve.com/images/favicon.png
    altText: APIVerve
servers:
- url: https://api.apiverve.com
security:
- api_key: []
tags:
- name: Data Generation
paths:
  /v1/acronymgenerator:
    get:
      summary: Acronym Generator
      description: Generate an acronym from a phrase by extracting the first letter of each word
      operationId: acronymgenerator
      parameters:
      - name: text
        in: query
        schema:
          type: string
        required: true
        description: The phrase to generate an acronym from (must contain at least 2 words)
        example: Application Programming Interface
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  text: Application Programming Interface
                  acronyms:
                  - API
                  - APP IN
                  - Accessing Program's Interface
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Data Generation
  /v1/babynamegenerator:
    get:
      summary: Baby Name Generator
      description: Generate a baby's first and middle name, based on the provided gender
      operationId: babynamegenerator
      parameters:
      - name: gender
        in: query
        schema:
          type: string
        required: true
        description: The gender for the generated names
        example: male
      - name: count
        in: query
        schema:
          type: integer
        required: false
        description: The number of names to generate
        example: 1
      - name: includeAvatar
        in: query
        schema:
          type: boolean
        required: false
        description: Include an AI-generated child face avatar matching gender
        example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  count: 1
                  names:
                  - firstName: Myra
                    middleName: Sherri
                    fullName: Myra Sherri
                    avatar: https://storage.googleapis.com/apiverve/APIResources/faces/Female/Child/11223344.jpg?X-Goog-Signature=...
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Data Generation
  /v1/barcodegenerator:
    post:
      summary: Barcode Generator
      description: Barcode Generator is a simple tool for generating barcodes from data. It returns a URL to the generated image of the barcode.
      operationId: barcodegenerator
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  imageName: cc85680f-a1d0-4627-89ff-7d7e53663a2b.png
                  format: .png
                  type: CODE128
                  expires: 1766010012598
                  downloadURL: https://storage.googleapis.com/apiverve/APIData/barcodegenerator/cc85680f-a1d0-4627-89ff-7d7e53663a2b.png?GoogleAccessId=635500398038-compute%40developer.gserviceaccount.com&Expires=1766010012&Signature=cV6ANXGGaVDdl5SOFZt3xm2haHBnOklW1zXQICvJlGNlF4kwYVP9i%2F1RAN8NBGxSUiMk4Zcro%2FJUb3W%2Fwy8jA86pyEXTwIjNAiGW94ikpKSXs6%2FiV42Rwv6u2gX%2B2FH7XYyixlwJ%2B%2FHpfGcvka6u01FDk%2F2TUcR7%2FxsZ%2FmXPU2KTrzsI6XttCGBcHhex3LdTv%2F8tzMJbSshbZn%2BGcRTddwv6dC4lCcTtGE6Bl2zqY9s92KIr9X%2F4xj34q4XKBzywgXES57QaVhZeGPPOOUfLtI3pAN8fVSyM%2B9NBMU7R46xyqJ0J8PSVpQZhhAHn03T%2B40rcNp26GXqauM9K%2BLwZRw%3D%3D
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: The data you want to generate a barcode from (string)
                type:
                  type: string
                  description: The type of barcode you want to generate
                lineColor:
                  type: string
                  description: 'The color of the barcode (default: #000000)'
                backgroundColor:
                  type: string
                  description: 'The background color of the barcode (default: #ffffff)'
                displayValue:
                  type: boolean
                  description: 'Whether to display the value below the barcode (default: true)'
              required:
              - data
              - type
      tags:
      - Data Generation
  /v1/bingocardgenerator:
