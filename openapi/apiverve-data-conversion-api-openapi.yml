  /v1/wordstonumbers:
    get:
      summary: Words to Numbers
      description: Convert words to numbers, including each word and the orginal equivalent
      operationId: wordstonumbers
      parameters:
      - name: words
        in: query
        schema:
          type: string
        required: true
        description: The words to convert to numbers
        example: seven thousand six hundred and twenty
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  number: '7620'
                  words: seven thousand, six hundred twenty
                  ordinal: seven thousand, six hundred twentieth
                  numberOfDigits_numeric: 4
                  numberOfDigits_words: four
                  eachNumber:
                  - seven
                  - six
                  - two
                  - zero
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Data Conversion
  /v1/xmltojson:
    post:
      summary: XML to JSON
      description: Convert XML to JSON
      operationId: xmltojson
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  note:
                    children:
                    - to:
                        content: Tove
                    - from:
                        content: Jani
                    - heading:
                        content: Reminder
                    - body:
                        content: Don't forget me this weekend!
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                xml:
                  type: string
                  description: The XML content to convert to JSON
              required:
              - xml
      tags:
      - Data Conversion
