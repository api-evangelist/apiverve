openapi: 3.2.0
info:
  title: APIVerve Data Conversion API
  description: One API key, 370+ real-world REST endpoints — weather, geocoding, finance, DNS, validation, text processing and more. Every endpoint returns JSON. Full documentation at https://docs.apiverve.com.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  license:
    name: APIVerve Terms of Service
    url: https://apiverve.com/terms/
  version: 1.0.0
  x-logo:
    url: https://apiverve.com/images/favicon.png
    altText: APIVerve
servers:
- url: https://api.apiverve.com
security:
- api_key: []
tags:
- name: Data Conversion
paths:
  /v1/ascii85encoder:
    get:
      summary: ASCII85 Encoder
      description: Encode text using ASCII85 (Base85) encoding
      operationId: ascii85encoder
      parameters:
      - name: text
        in: query
        schema:
          type: string
        required: true
        description: Text to encode
        example: Hello World
      - name: action
        in: query
        schema:
          type: string
        required: false
        description: Action to perform
        example: encode
      - name: format
        in: query
        schema:
          type: string
        required: false
        description: Output format
        example: standard
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  original_text: Hello World
                  encoded: 87cURD]i,"Ebo7
                  format: standard
                  original_length: 11
                  encoded_length: 14
                  compression_ratio: 127.27%
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Data Conversion
  /v1/base64:
    get:
      summary: Base64 Encoder/Decoder
      description: Encode text to Base64 format
      operationId: base64
      parameters:
      - name: text
        in: query
        schema:
          type: string
        required: true
        description: The text to encode
        example: Hello World
      - name: action
        in: query
        schema:
          type: string
        required: false
        description: The action to perform
        example: encode
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  action: encode
                  original: Hello World
                  encoded: SGVsbG8gV29ybGQ=
                  length: 16
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Data Conversion
  /v1/colorconverter:
    get:
      summary: Color Converter
      description: Convert a color to a different format
      operationId: colorconverter
      parameters:
      - name: hex
        in: query
        schema:
          type: string
        required: true
        description: 'The color in hexadecimal format (e.g., FF0000). Make sure you ommit the #'
        example: FF0000
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  hex: '#FF0000'
                  rgb: 255, 0, 0
                  hsl: 0, 100, 50
                  cmyk: 0, 100, 100, 0
                  ansi16: 91
                  name: red
                  channels:
                    rgbChannels: 3
                    cmykChannels: 4
                    ansiChannels: 1
                    hexChannels: 1
                    hslChannels: 3
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Data Conversion
  /v1/csvtojson:
    post:
      summary: CSV to JSON Converter
      description: Convert CSV data to JSON format with custom delimiter support
      operationId: csvtojson
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  row_count: 2
                  column_count: 3
                  columns:
                  - name
                  - age
                  - city
                  inferredTypes:
                    name: string
                    age: integer
                    city: string
                  json:
                  - name: John Doe
                    age: '30'
                    city: New York
                  - name: Jane Smith
                    age: '25'
                    city: Los Angeles
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                csv:
                  type: string
                  description: The CSV data to convert to JSON
                delimiter:
                  type: string
                  description: The delimiter used in the CSV
                has_header:
                  type: boolean
                  description: 'Whether the first row contains column headers (default: true)'
              required:
              - csv
      tags:
      - Data Conversion
  /v1/filesizeformatter:
    get:
      summary: File Size Formatter
      description: Convert bytes to human-readable file size
      operationId: filesizeformatter
      parameters:
      - name: bytes
        in: query
        schema:
          type: integer
        required: true
        description: Number of bytes to format
        example: 1073741824
      - name: unit
        in: query
        schema:
          type: string
        required: false
        description: Specific target unit (optional, auto-selects best unit if not specified)
        example: GB
      - name: precision
        in: query
        schema:
          type: integer
        required: false
        description: Decimal places (0-10)
        example: 2
      - name: standard
        in: query
        schema:
          type: string
        required: false
        description: 'Standard to use: binary (1024) or decimal (1000)'
        example: binary
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  bytes: 1073741824
                  formatted: 1 GiB
                  value: 1
                  unit: GiB
                  standard: binary
                  precision: 2
                  conversions:
                    B: 1073741824
                    KiB: 1048576
                    MiB: 1024
                    GiB: 1
                    TiB: 0
                    PiB: 0
                    EiB: 0
                    ZiB: 0
                    YiB: 0
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Data Conversion
  /v1/htmlentities:
    post:
      summary: HTML Entities Encoder/Decoder
      description: Encode HTML special characters to entities for XSS prevention
      operationId: htmlentities
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  action: encode
                  original: <div class="test">Hello & World</div>
                  encoded: '&lt;div class=&quot;test&quot;&gt;Hello &amp; World&lt;&#x2F;div&gt;'
                  entities_replaced:
                  - <
                  - '"'
                  - '>'
                  - '&'
                  - /
                  count: 8
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                html:
                  type: string
                  description: The HTML content to encode
                action:
                  type: string
                  description: The action to perform
              required:
              - html
      tags:
      - Data Conversion
  /v1/htmltoimage:
    post:
      summary: HTML to Image
      description: Convert HTML code to image with customizable dimensions
      operationId: htmltoimage
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  width: 800
                  height: 600
                  format: png
                  imageName: bf3d3d67-bc6e-477b-a916-560b895f8091.png
                  expires: 1789676439207
                  downloadURL: https://storage.googleapis.com/apiverve/APIData/htmltoimage/bf3d3d67-bc6e-477b-a916-560b895f8091.png?GoogleAccessId=635500398038-compute%40developer.gserviceaccount.com&Expires=1789676439&Signature=Uw7imp8TVuygEgWhdLAmK8%2Byk0NoZmtdLEX9MrDHjlWDYyB28y7zbCxVuD%2BF%2F6Iij5zi%2FhvDoJnuhNT6a2Yl85gw5nWGt750Ai4gup46dQQt0vrsUpD99IPTfTh21DWd4WqE7VCWlIlou7WwNUn620WgWM3ScGi13dCB81Qyb4WuxrdcNal8WrUYX9nZ12h%2B7BZs65Tyw0V4StbvsYxXKqySkF4aQ8J1QbdhUny9WyptE3qNT%2FyM4m2%2F%2FJAOq32bQsSWj8%2BycWEhtifIgpJe4LTBBeqtHBePrIQSrYNRdOwhjaTzj%2BShSeox5wPztiaoRyi1DGIx4FIIstS2dAdQ6Q%3D%3D
                  htmlLength: 197
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                html:
                  type: string
                  description: HTML code to convert
                width:
                  type: integer
                  description: Image width in pixels
                height:
                  type: integer
                  description: Image height in pixels
                format:
                  type: string
                  description: Output image format
              required:
              - html
      tags:
      - Data Conversion
  /v1/jsontocsv:
    post:
      summary: JSON to CSV Converter
      description: Convert JSON array data to CSV format
      operationId: jsontocsv
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  row_count: 2
                  column_count: 3
                  columns:
                  - name
                  - age
                  - city
                  csv: 'name,age,city

                    John Doe,30,New York

                    Jane Smith,25,Los Angeles'
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                json:
                  type: string
                  description: The JSON array to convert to CSV (must be array of objects)
                delimiter:
                  type: string
                  description: The delimiter to use in the CSV
                include_header:
                  type: boolean
                  description: 'Whether to include column headers in the output (default: true)'
              required:
              - json
      tags:
      - Data Conversion
  /v1/jsontojsonp:
    post:
      summary: JSON to JSONP
      description: JSON to JSONP is a simple tool for converting JSON data into JSONP format. It returns the converted JSONP data.
      operationId: jsontojsonp
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  callback: callbackFunction
                  jsonp: callbackFunction({"menu":{"id":"file","value":"File","popup":false}});
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                json:
                  type: string
                  description: The JSON data you want converted into JSONP format. Send it as an object or as a JSON-encoded string.
                callback:
                  type: string
                  description: The callback function name to wrap the JSON data. Must be a JavaScript identifier, optionally dotted (e.g. myCallback or window.myCallback).
              required:
              - json
      tags:
      - Data Conversion
  /v1/jwtdecoder:
    post:
      summary: JWT Decoder
      description: Decode JWT token without verification
      operationId: jwtdecoder
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  header:
                    alg: HS256
                    typ: JWT
                  payload:
                    sub: '1234567890'
                    name: John Doe
                    iat: 1516239022
                  signature: SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
                  isExpired: false
                  expiresAt: null
                  issuedAt: '2018-01-18T01:30:22.000Z'
                  tokenAge: 2557 days
                  algorithm: HS256
                  expiresIn: null
                  notYetValid: false
                  securityAnalysis:
                    isUnsecured: false
                    hasExpiration: false
                    isLongLived: false
                    issues:
                    - Token has no expiration (exp) claim — it never expires
                  warning: This API only decodes JWT tokens. It does NOT verify signatures. Do not use for security validation.
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: JWT token to decode
              required:
              - token
      tags:
      - Data Conversion
  /v1/markdowntable:
    post:
      summary: Markdown Table Generator
      description: Convert data to a formatted markdown table
      operationId: markdowntable
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  markdown: '| Name | Age | City |

                    | --- | --- | --- |

                    | John Doe | 30 | New York |

                    | Jane Smith | 25 | Los Angeles |

                    | Bob Johnson | 35 | Chicago |'
                  columnCount: 3
                  rowCount: 3
                  cellCount: 12
                  headers:
                  - Name
                  - Age
                  - City
                  alignments:
                  - left
                  - left
                  - left
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                headers:
                  type: string
                  description: Array of column header names
                rows:
                  type: string
                  description: Array of row arrays containing cell values
                alignment:
                  type: string
                  description: 'Column alignment: left, center, right, or array of alignments per column'
              required:
              - headers
              - rows
      tags:
      - Data Conversion
  /v1/markdowntohtml:
    post:
      summary: Markdown to HTML
      description: Convert markdown text to HTML
      operationId: markdowntohtml
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  html: '<h1>Hello World</h1>

                    <p>This is a <strong>bold</strong> statement and this is <em>italic</em>.</p>

                    <h2>Features</h2>

                    <ul>

                    <li>Easy to use</li>

                    <li>Fast conversion</li>

                    <li>Supports common markdown syntax</li>

                    </ul>

                    <p><a href="https://example.com">Link to example</a></p>

                    '
                  markdownLength: 185
                  htmlLength: 272
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                markdown:
                  type: string
                  description: Markdown text to convert (max 100,000 characters)
              required:
              - markdown
      tags:
      - Data Conversion
  /v1/markdowntoimage:
    post:
      summary: Markdown to Image
