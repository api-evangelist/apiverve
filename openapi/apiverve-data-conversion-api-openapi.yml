  /v1/math:
    post:
      summary: Math Calculator
      description: 'Perform basic math operations: add, subtract, multiply, divide, power, modulo'
      operationId: math
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  result: 15
                  operation: add
                  input:
                    a: 10
                    b: 5
                  steps:
                  - 10 + 5 = 15
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
