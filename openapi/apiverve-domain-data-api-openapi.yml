        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Domain Data
  /v1/fullyqualifieddomain:
    get:
      summary: Fully Qualified Domain
      description: Get the fully qualified domain name of an ip
      operationId: fullyqualifieddomain
      parameters:
      - name: ip
        in: query
        schema:
          type: string
        required: true
        description: The IP address to get the fully qualified domain name of
        example: 199.30.24.0
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ip: 199.30.24.0
                  baseDomain: msn.com
                  fqdn: msnbot-199-30-24-0.search.msn.com
                  tld: com
                  subdomain: msnbot-199-30-24-0.search
                  domainLevels: 5
                  detected: true
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Domain Data
  /v1/mxlookup:
    get:
      summary: MX Lookup
      description: MX Lookup is a simple tool for getting MX records for a domain. It returns the MX records for the given domain.
      operationId: mxlookup
      parameters:
      - name: domain
        in: query
        schema:
          type: string
        required: true
        description: The domain you want to get the MX records for (e.g. yahoo.com)
        example: yahoo.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  domain: yahoo.com
                  mx:
                  - priority: 1
                    exchange: mta7.am0.yahoodns.net
                  - priority: 1
                    exchange: mta6.am0.yahoodns.net
                  - priority: 1
                    exchange: mta5.am0.yahoodns.net
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Domain Data
  /v1/reversednslookup:
    get:
      summary: Reverse DNS Lookup
      description: Get the hostname associated with an IP address
      operationId: reversednslookup
      parameters:
      - name: ip
        in: query
        schema:
          type: string
        required: true
        description: The IP address to lookup (IPv4 or IPv6)
        example: 8.8.8.8
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ip: 8.8.8.8
                  hostname: dns.google
                  ptr:
                  - dns.google
                  found: true
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Domain Data
  /v1/spfvalidator:
    get:
      summary: SPF Validator
