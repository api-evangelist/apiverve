        '500':
          description: A server error has occurred, try again later
      tags:
      - Domain Data
  /v1/dnspropagation:
    get:
      summary: DNS Propagation Checker
      description: Check DNS propagation for a domain across global DNS servers
      operationId: dnspropagation
      parameters:
      - name: domain
        in: query
        schema:
          type: string
        required: true
        description: The domain name to check propagation for
        example: google.com
      - name: type
        in: query
        schema:
          type: string
        required: false
        description: The DNS record type to check
        example: A
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  domain: google.com
                  recordType: A
                  propagationComplete: true
                  serversChecked: 10
