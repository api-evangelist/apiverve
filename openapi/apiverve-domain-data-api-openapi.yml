openapi: 3.2.0
info:
  title: APIVerve Domain Data API
  description: One API key, 370+ real-world REST endpoints — weather, geocoding, finance, DNS, validation, text processing and more. Every endpoint returns JSON. Full documentation at https://docs.apiverve.com.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  license:
    name: APIVerve Terms of Service
    url: https://apiverve.com/terms/
  version: 1.0.0
  x-logo:
    url: https://apiverve.com/images/favicon.png
    altText: APIVerve
servers:
- url: https://api.apiverve.com
security:
- api_key: []
tags:
- name: Domain Data
paths:
  /v1/bimivalidator:
    get:
      summary: BIMI Record Validator
      description: BIMI Validator checks if a domain has a valid BIMI record published in DNS. BIMI enables domain owners to display verified logos in supported email clients.
      operationId: bimivalidator
      parameters:
      - name: domain
        in: query
        schema:
          type: string
        required: true
        description: The domain to validate the BIMI record for
        example: ebay.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  host: ebay.com
                  bimi_host: default._bimi.ebay.com
                  has_bimi_record: true
                  bimi_record: v=BIMI1;l=https://vmc.digicert.com/2b7216dc-27d2-4fbd-8472-f68790117238.svg;a=https://vmc.digicert.com/2b7216dc-27d2-4fbd-8472-f68790117238.pem
                  bimi_records_count: 1
                  version: BIMI1
                  svg_logo:
                    url: https://vmc.digicert.com/2b7216dc-27d2-4fbd-8472-f68790117238.svg
                    status_code: 200
                    valid: true
                    file_size_bytes: 1518
                  vmc_certificate:
                    url: https://vmc.digicert.com/2b7216dc-27d2-4fbd-8472-f68790117238.pem
                    status_code: 200
                    valid: true
                  issues_found: []
                  valid: true
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Domain Data
  /v1/dkimvalidator:
    get:
      summary: DKIM Validator
      description: DKIM Validator checks the DomainKeys Identified Mail (DKIM) DNS records for a domain to verify that they are present and correctly formatted.
      operationId: dkimvalidator
      parameters:
      - name: domain
        in: query
        schema:
          type: string
        required: true
        description: The domain to validate the DKIM record for
        example: github.com
      - name: selector
        in: query
        schema:
          type: string
        required: false
        description: The DKIM selector to look up (the label before ._domainkey). When omitted, a list of common selectors is tried
        example: s1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  selector: s1
                  host: github.com
                  dkim_host: s1._domainkey.github.com
                  cname_target: null
                  has_dkim_record: true
                  dkim_record: k=rsa; t=s; 
                  dkim_records_count: 1
                  key_type: rsa
                  issues_found:
                  - code: V_TAG_NOT_FOUND
                    type: warning
                    message: The v tag is missing
                  - code: STRICT_MODE
                    type: info
                    message: 'Strict flag set (t=s): the i= identity domain must exactly match d= (no subdomains)'
                  valid: true
                  key_bits: 2048
                  is_test_mode: false
                  risk_score: 0
                  risk_level: low
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Domain Data
  /v1/dmarcvalidator:
    get:
      summary: DMARC Validator
      description: DMARC Validator checks the Domain-based Message Authentication, Reporting and Conformance (DMARC) record for a domain to ensure it is correctly configured.
      operationId: dmarcvalidator
      parameters:
      - name: domain
        in: query
        schema:
          type: string
        required: true
        description: The domain to validate the DMARC record for
        example: paypal.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  host: paypal.com
                  dmarcHost: _dmarc.paypal.com
                  hasDmarc: true
                  dmarc_record: v=DMARC1; p=reject; rua=mailto:d@rua.agari.com,mailto:dmarc_agg@vali.email; ruf=mailto:d@ruf.agari.com,mailto:MTc4Mzcw@ruf.vali.email
                  rua:
                    email: d@rua.agari.com,dmarc_agg@vali.email
                    domain: rua.agari.com
                    valid: true
                  ruf:
                    email: d@ruf.agari.com,MTc4Mzcw@ruf.vali.email
                    domain: ruf.agari.com
                    valid: true
                  v: DMARC1
                  p: reject
                  sp: null
                  pct: null
                  adkim: null
                  aspf: null
                  fo: null
                  rf: null
                  ri: null
                  valid: true
                  issues: []
                  isEnforced: true
                  riskScore: 5
                  riskLevel: low
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Domain Data
  /v1/dnslookup:
    get:
      summary: DNS Lookup
      description: Lookup the DNS records of a domain
      operationId: dnslookup
      parameters:
      - name: domain
        in: query
        schema:
          type: string
        required: true
        description: The domain name for which you want to lookup the DNS records. Do not include the protocol, and not subdomains (e.g., myspace.com)
        example: myspace.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  domain: myspace.com
                  records:
                    A:
                    - 34.111.176.156
                    AAAA: null
                    CNAME: null
                    MX:
                    - exchange: us-smtp-inbound-1.mimecast.com
                      priority: 10
                    - exchange: us-smtp-inbound-2.mimecast.com
                      priority: 10
                    NS:
