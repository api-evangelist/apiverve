  /v1/dnsseccheck:
    get:
      summary: DNSSEC Checker
      description: Validate DNSSEC configuration for a domain
      operationId: dnsseccheck
      parameters:
      - name: domain
        in: query
        schema:
          type: string
        required: true
        description: The domain name to check DNSSEC configuration for
        example: cloudflare.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  domain: cloudflare.com
                  dnssecEnabled: true
                  valid: true
                  records:
                    dnskey: 3
                    ds: 2
                    nsec: NSEC3
                  errors: []
                  details:
                    dnskeyCount: 3
                    dsCount: 2
                  status: DNSSEC is properly configured with DS records at parent
                  recommendation: DNSSEC is properly configured
                  riskScore: 5
                  riskLevel: low
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Domain Data
  /v1/domainavailability:
    get:
      summary: Domain Availability
      description: Check if a domain is available
      operationId: domainavailability
      parameters:
      - name: domain
        in: query
        schema:
          type: string
        required: true
        description: The domain to check if it is available
        example: myspace.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  domain: myspace.com
                  available: false
                  owner:
                    registrar: GoDaddy.com, LLC
                    createdDate: '1996-02-22T05:00:00Z'
                    expiryDate: '2029-02-23T05:00:00Z'
                  source: rdap
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Domain Data
  /v1/domainexpiration:
    get:
      summary: Domain Expiration
      description: Check the expiration date of a domain
      operationId: domainexpiration
      parameters:
      - name: domain
        in: query
        schema:
          type: string
        required: true
        description: The domain to check the expiration date of
        example: myspace.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
