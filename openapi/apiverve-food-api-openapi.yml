                    water: 74.9
                  analytics:
                    caloriesPerGram: 0.89
                    proteinCaloriePercent: 4.4
                    fatCaloriePercent: 3
                    carbCaloriePercent: 92.6
                    proteinPer100Calories: 1.22
                  dailyValues:
                    protein: 2.2
                    totalFat: 0.4
                    saturatedFat: 0.6
                    cholesterol: 0
                    sodium: 0
                    carbohydrates: 8.3
                    fiber: 9.3
                    potassium: 7.6
                    calcium: 0.4
                    iron: 1.4
