                    thiamin: 2.6
                    riboflavin: 5.6
                    niacin: 4.2
                    vitaminB6: 21.6
                    folate: 5
                    vitaminB12: 0
                  dietaryFlags:
                    highProtein: false
                    goodSourceOfProtein: false
                    highFiber: false
                    goodSourceOfFiber: false
                    lowSodium: true
