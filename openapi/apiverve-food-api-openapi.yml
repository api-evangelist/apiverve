                    lowSaturatedFat: true
                    lowCholesterol: true
                    lowCalorie: false
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Food
  /v1/recipe:
    get:
      summary: Recipe Generator
      description: Recipe Generator is an AI-powered tool for generating detailed recipes. It returns complete recipes with ingredients, instructions, prep time, cook time, and servings.
      operationId: recipe
      parameters:
      - name: name
        in: query
        schema:
          type: string
        required: true
        description: The name or description of the recipe you want to generate
        example: chicken fajitas
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  name: Chicken Fajitas
                  description: A flavorful and easy-to-make dish with marinated chicken, bell peppers, and onions, served with warm tortillas.
                  ingredients:
                  - 1.5 pounds boneless, skinless chicken breasts, sliced
                  - 1 red bell pepper, sliced
                  - 1 green bell pepper, sliced
                  - 1 large onion, sliced
                  - 2 tablespoons olive oil
                  - 1 packet (1 ounce) fajita seasoning
                  - 1/2 cup water
                  - 12 flour tortillas
                  - 'Optional toppings: sour cream, guacamole, salsa, shredded cheese'
                  instructions: '1. In a bowl, combine chicken with fajita seasoning and water. Marinate for at least 15 minutes.

                    2. Heat olive oil in a large skillet or cast-iron pan over medium-high heat.

                    3. Add the chicken and cook until browned and cooked through, about 5-7 minutes.

                    4. Add bell peppers and onions to the skillet. Cook until softened, about 5-7 minutes.

                    5. Warm tortillas according to package instructions.

                    6. Serve chicken and vegetables in warm tortillas with desired toppings.'
                  prep_time: 15 minutes
                  cook_time: 20 minutes
                  servings: 4
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      tags:
      - Food
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
externalDocs:
  description: APIVerve Documentation
  url: https://docs.apiverve.com
