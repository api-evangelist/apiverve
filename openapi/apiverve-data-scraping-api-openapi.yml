          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: The URL of the web page to capture the screenshot (e.g., https://example.com)
                type:
                  type: string
                  description: The image format for the screenshot
                width:
                  type: number
                  description: The width of the screenshot in pixels (e.g., 1920). Must be between 100 and 3840
                height:
                  type: number
                  description: The height of the screenshot in pixels (e.g., 1080).  Must be between 100 and 3840
                fullpage:
                  type: boolean
                  description: Whether to capture the full page screenshot (true or false)
              required:
              - url
