openapi: 3.2.0
info:
  title: APIVerve Data Scraping API
  description: One API key, 370+ real-world REST endpoints — weather, geocoding, finance, DNS, validation, text processing and more. Every endpoint returns JSON. Full documentation at https://docs.apiverve.com.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  license:
    name: APIVerve Terms of Service
    url: https://apiverve.com/terms/
  version: 1.0.0
  x-logo:
    url: https://apiverve.com/images/favicon.png
    altText: APIVerve
servers:
- url: https://api.apiverve.com
security:
- api_key: []
tags:
- name: Data Scraping
paths:
  /v1/contactextractor:
    post:
      summary: Contact Extractor
      description: Extract contact data from a web page
      operationId: contactextractor
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  url: https://en.wikipedia.org/wiki/Email_address
                  emails:
                  - john.smith@example.com
                  - jsmith@example.com
                  - john.smith@example.org
                  - John..Doe@example.com
                  - johns@example.com
                  - JohnS@example.com
                  - tag@example.com
                  - joeuser@example.com
                  - simple@example.com
                  - very.common@example.com
                  - FirstName.LastName@EasierReading.org
                  - x@example.com
                  - long.email-address-with-hyphens@and.subdomains.example.com
                  - sorting@example.com
                  - user.name@example.com
                  - surname@example.com
                  - example@s.example
                  - username@example.org
                  - example.com@example.org
                  - user@example.com
                  - user-@example.org
                  - CHOCOLATE@example.com
                  - c@example.com
                  - l@example.com
                  - right@example.com
                  - allowed@example.com
                  - onore@example.com
                  - extension@pobox.com
                  phones: []
                  places:
                  - China
                  - Japan
                  - Russia
                  - Rajasthan
                  - India
                  emailCount: 27
                  phoneCount: 0
                  placeCount: 5
                  uniqueDomains:
                  - example.com
                  - example.org
                  - s.example
                  - EasierReading.org
                  - pobox.com
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: The URL of the web page to extract contact data from
                limit:
                  type: number
                  description: Limits the number of found contact details found on the page. Set -1 for unlimited
              required:
              - url
      tags:
      - Data Scraping
  /v1/linkscraper:
    post:
      summary: Link Scraper
      description: Scrape all the links on a web page
      operationId: linkscraper
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  url: http://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html
                  linkCount: 16
                  externalLinkCount: 13
                  internalLinkCount: 3
                  links:
                  - text: Documentation
                    href: http://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html/index.html
                    external: false
                  - text: Amazon EC2 Instance Types Guide
                    href: https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-types.html
                    external: true
                  - text: Amazon EC2 Auto Scaling
                    href: https://docs.aws.amazon.com/autoscaling/
                    external: true
                  uniqueDomains:
                  - docs.aws.amazon.com
                  - aws.amazon.com
                  maxLinksReached: false
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: The URL of the web page to scrape links from
                maxlinks:
                  type: number
                  description: Maximum number of links to scrape and return
                includequery:
                  type: boolean
                  description: Include query strings in the scraped links
              required:
              - url
      tags:
      - Data Scraping
  /v1/seoscraper:
    post:
      summary: SEO Data Scraper
      description: Scrape SEO data from a web page
      operationId: seoscraper
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  url: https://apiverve.com
                  title: APIVerve — One key for 300+ production APIs
                  description: Consistent schemas, predictable credit pricing, and an uptime SLA on every paid plan across 300+ production APIs. One key, one bill, zero glue code.
                  keywords: ''
                  author: ''
                  canonical: ''
                  og:title: APIVerve — One key for 300+ production APIs
                  og:description: Consistent schemas, predictable credit pricing, and an uptime SLA on every paid plan across 300+ production APIs. One key, one bill, zero glue code.
                  og:image: https://apiverve.com/social-images/page-home.png
                  og:url: https://apiverve.com
                  og:type: website
                  og:site_name: APIVerve
                  twitter:card: summary_large_image
                  twitter:title: APIVerve — One key for 300+ production APIs
                  twitter:description: Consistent schemas, predictable credit pricing, and an uptime SLA on every paid plan across 300+ production APIs.
                  twitter:image: https://apiverve.com/social-images/page-home.png
                  twitter:site: ''
                  robots: ''
                  viewport: width=device-width, initial-scale=1, maximum-scale=1
                  charset: utf-8
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: The URL of the web page to scrape SEO data from
              required:
              - url
      tags:
      - Data Scraping
  /v1/webimagescraper:
    post:
      summary: Website Images Scraper
      description: Web Image Scraper is a simple tool for scraping images from a website. It returns the URLs of the images found on the website.
      operationId: webimagescraper
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  url: http://en.wikipedia.org/wiki/Solar_System
                  imageCount: 25
                  externalImageCount: 0
                  internalImageCount: 25
                  images:
                  - src: http://en.wikipedia.org/wiki/Solar_System/static/images/icons/wikipedia.png
