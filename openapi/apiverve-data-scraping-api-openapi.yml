  /v1/webscreenshots:
    post:
      summary: Website Screenshot
      description: Capture a screenshot of a web page
      operationId: webscreenshots
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  width: 1024
                  height: 600
                  scaleFactor: 1
                  imageName: 77072426-6af8-45c2-93dd-d7013d2c765e.png
                  expires: 1766097105719
                  url: https://ebay.com/
