name: APIVerve
description: >-
  An agent-native API marketplace exposing 300+ (367+ enumerated) ready-made REST APIs behind a single API key with a
  uniform JSON envelope. Offers REST, an alpha GraphQL gateway, OpenAPI + Postman contracts, a self-hosted apis.json, an
  llms.txt, and a hosted remote MCP server that turns the whole catalog into agent tools.
url: https://raw.githubusercontent.com/api-evangelist/apiverve/refs/heads/main/apis.yml
